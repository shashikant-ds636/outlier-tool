<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="28" fill="url(#bg)"/>

  <!-- icon: data points + limits + one outlier -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="180" height="180" rx="22" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <line x1="18" y1="62" x2="162" y2="62" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="8 7"/>
    <line x1="18" y1="148" x2="162" y2="148" stroke="#2dd4bf" stroke-width="3" stroke-dasharray="8 7"/>
    <g fill="#60a5fa">
      <circle cx="38" cy="112" r="8"/><circle cx="62" cy="96" r="8"/>
      <circle cx="84" cy="118" r="8"/><circle cx="106" cy="102" r="8"/>
      <circle cx="128" cy="124" r="8"/><circle cx="148" cy="108" r="8"/>
    </g>
    <circle cx="96" cy="26" r="11" fill="#f87171"/>
    <circle cx="96" cy="26" r="19" fill="none" stroke="#f87171" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <text x="285" y="128" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" fill="#f8fafc">Outlier <tspan fill="#2dd4bf">Tool</tspan></text>
  <text x="288" y="176" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="28" fill="#94a3b8">Detect  ·  Cap  ·  Trim  ·  Replace</text>
  <text x="288" y="214" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="20" fill="#64748b">IQR and Z-score outlier handling for pandas</text>
</svg>
