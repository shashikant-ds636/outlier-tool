[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-tool-shashikant"
version = "0.1.1"
description = "A simple Python toolkit for detecting and handling outliers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]
